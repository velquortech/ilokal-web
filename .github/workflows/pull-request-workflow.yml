name: Ilokal Web app github actions based on pull request

run-name: Ilokal Web pull request CI/CD pipeline

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on: [pull_request]

jobs:
  Setup:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_IMAGE_PUBLIC_URL: ${{ secrets.NEXT_IMAGE_PUBLIC_URL }}

    steps:
      - name: Make envfile
        uses: SpicyPizza/create-envfile@v1
        with:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_IMAGE_PUBLIC_URL: ${{ secrets.NEXT_IMAGE_PUBLIC_URL }}
          file_name: .env

      - name: Yarn install
        uses: actions/checkout@v4

      - name: Node Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install
      - run: yarn run build
      - run: yarn run lint
      - run: yarn run check:pii

  Unit-tests:
    runs-on: ubuntu-latest
    needs: Setup

    strategy:
      matrix:
        node-version: [22.x]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_IMAGE_PUBLIC_URL: ${{ secrets.NEXT_IMAGE_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install
      - name: Run unit tests
        run: yarn vitest run --reporter=verbose --exclude="**/*.integration.test.ts"

  Integration-tests:
    runs-on: ubuntu-latest
    needs: Setup

    strategy:
      matrix:
        node-version: [22.x]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_IMAGE_PUBLIC_URL: ${{ secrets.NEXT_IMAGE_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
      - run: yarn install
      - name: Run integration tests
        run: yarn vitest run --reporter=verbose "integration.test"

  # Probe job: job-level `if` conditions cannot read the `secrets` or `env`
  # contexts (GitHub's parser rejects both), so surface whether live
  # credentials exist as a job output that the gated job reads via `needs` —
  # the only supported way to skip a job based on a secret's presence.
  Pull-live-credentials:
    runs-on: ubuntu-latest
    outputs:
      has_credentials: ${{ steps.check.outputs.has_credentials }}
    steps:
      - id: check
        run: |
          if [[ "${{ secrets.SUPABASE_DB_URL }}" != "" ]]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
          fi

  # Pull-live regression check: runs pull-live.sh against a SCRATCH local
  # Supabase stack and asserts the verification block (see
  # supabase/scripts/check-pull-live.sh). Without live credentials the job is
  # SKIPPED (a visible skipped check, decided by the probe output above),
  # never a green pass — a green pass that never ran the script is exactly
  # the silent regression this job exists to catch. Ubuntu runners have
  # Docker + the Supabase CLI is installed below; the scratch stack uses
  # offset ports (5532x) so nothing collides. The source-level contract test
  # (__test__/config/pull-live-script.contract.test.ts) pins the script's
  # verification invariants so they cannot regress even when this job skips.
  Pull-live-check:
    runs-on: ubuntu-latest
    needs: [Setup, Pull-live-credentials]
    if: ${{ needs.Pull-live-credentials.outputs.has_credentials == 'true' }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'yarn'
      - run: yarn install
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0
      # The check reads live creds from .env.cloud when present, or from these
      # env vars (pull-live.sh honours LIVE_KEY/LIVE_HOST/SUPABASE_DB_URL
      # overrides). Without secrets it prints SKIP and exits 0.
      - name: Write .env.cloud from secrets
        if: env.SUPABASE_DB_URL != ''
        run: |
          cat > .env.cloud <<EOF
          SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EOF
      - name: Run pull-live regression check
        run: make pull-live-check

