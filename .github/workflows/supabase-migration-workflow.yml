name: Deploy Supabase Migrations

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches:
      - main

jobs:
  Deploy-migration:
    runs-on: [ubuntu-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned, not `latest`. Every flag this job depends on was verified
      # against exactly this version, and it is the one the repo installs
      # (package.json: supabase ^2.101.0) — so a CI failure here reproduces
      # locally instead of being a version nobody has. `latest` in a workflow
      # nobody watches is how a silent flag change becomes a silent non-deploy,
      # which is the failure this job exists to end. Bump it deliberately.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.101.0

      # Authenticates over the Management API with a personal access token
      # instead of a raw Postgres connection string. Three reasons this beats
      # --db-url from a GitHub runner:
      #   * No database password to store, leak or rotate.
      #   * No IPv4 problem. Supabase direct connections are IPv6-only without
      #     the paid add-on and GitHub-hosted runners are IPv4-only, so a
      #     direct --db-url fails on the network before it fails on auth;
      #     avoiding it also avoids the session-vs-transaction pooler trap
      #     (5432 works for migrations, 6543 does not).
      #   * The token is revocable on its own, separately from DB credentials.
      # Trade-off, stated plainly: a PAT is ACCOUNT-scoped, so it can reach
      # every project the owning account can see. Use a dedicated CI token.
      - name: Select the target project
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "SUPABASE_PROJECT_REF=$PROJECT_REF_PRODUCTION" >> "$GITHUB_ENV"
          else
            echo "SUPABASE_PROJECT_REF=$PROJECT_REF_ACCEPTANCE" >> "$GITHUB_ENV"
          fi
        env:
          PROJECT_REF_PRODUCTION: ${{ secrets.SUPABASE_PROJECT_REF_PRODUCTION }}
          PROJECT_REF_ACCEPTANCE: ${{ secrets.SUPABASE_PROJECT_REF_ACCEPTANCE }}

      # Without this, an unset secret expands to an empty string and the CLI
      # answers with a 40-line usage dump — which is what every run of this
      # workflow did, in 11-16 seconds, unnoticed, while the PR pipeline stayed
      # green. Fail with a sentence that names the secret instead.
      - name: Verify the required secrets are set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF_PRODUCTION"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. Set them under Settings > Secrets and variables > Actions. Create the token at https://supabase.com/dashboard/account/tokens. Until they are set, NO migration reaches the database and every push to main silently leaves cloud behind."
            exit 1
          fi

      # `--yes` is on CLAUDE.md's authority, which documents it as the required
      # form; a runner has no TTY to answer a confirmation prompt with, and the
      # flag is harmless if none is asked. NOT independently reproduced here —
      # a --dry-run fails earlier, on the version mismatch described below, so
      # the prompt is never reached. Treat it as inherited, not measured.
      #
      # `link` WAS measured: it does not prompt for a database password with
      # stdin closed (exit 0), which is what makes the passwordless PAT path
      # above viable here.
      #
      # Expected failure worth recognising in the log:
      #   "Remote migration versions not found in local migrations directory"
      # means the DATABASE is ahead of this branch — someone applied a
      # migration out of band, typically from a branch that has not merged yet.
      # `db push` refuses rather than guessing, and it is right to. Fix it by
      # merging the branch that owns that migration; only use
      # `supabase migration repair` if the version is genuinely never coming.
      - name: Apply Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked --yes

      # `db push` keys on the migration VERSION, so a migration whose ledger row
      # already exists is SKIPPED WHOLE — including statements added to the file
      # after it was first applied. Not hypothetical: idx_products_section_id was
      # added to 20260801061117 in a later commit and never reached the database,
      # while the migration still read as applied. `db push` cannot detect this;
      # only comparing declared objects against the live catalog can.
      - name: Verify every declared object exists on the database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          inventory=supabase/reports/cloud_object_inventory.sql

          # `json` is the only format this command accepts EXPLICITLY. The
          # global --output (env|pretty|json|toml|yaml) shadows the command's
          # own (table|json|csv), so `--output csv` and `--output table` are
          # both REJECTED outright — verified against 2.101.0. Passing `json`
          # anyway pins the shape, because the default is undocumented and a
          # default that changes would silently reshape what is parsed below.
          supabase db query --linked --output json -f "$inventory" > inventory.json

          # Prove the check RAN before trusting what it says. A guard that can
          # only ever find a problem — never show it looked — is the same class
          # of bug as the workflow it guards: the previous version of this step
          # grepped for a JSON fragment, so empty, truncated or reshaped output
          # matched nothing and reported "all present". Compare the row count
          # against the objects the file declares; any mismatch fails here.
          expected=$(grep -cE "^  \('(function|index|trigger|policy|column)'," "$inventory" || true)
          if [ "$expected" -lt 1 ]; then
            echo "::error::Could not count the objects declared by $inventory — its shape changed. Update this step; do not delete the count."
            exit 1
          fi
          # Empty output leaves jq silent rather than failing, so name it 0
          # instead of printing "returned  rows". `db query --output json`
          # returns a BARE ARRAY of rows (verified against 2.101.0 on the
          # first-ever successful deploy); accept the {rows:[...]} envelope too
          # in case a future CLI version wraps it. Anything else (an error
          # object, an empty string) makes jq exit non-zero and `set -e` ends
          # the job, which is correct.
          actual=$(jq 'if type == "object" then (.rows | length) else length end' inventory.json)
          actual=${actual:-0}
          if [ "$actual" != "$expected" ]; then
            echo "::error::Inventory returned $actual rows, expected $expected. The query did not run to completion, so a zero-missing verdict would mean nothing."
            exit 1
          fi

          missing=$(jq -r 'if type == "object" then .rows else . end | .[] | select(.status != "ok") | "  \(.kind)  \(.name)"' inventory.json)
          if [ -n "$missing" ]; then
            echo "::error::Objects declared by migrations are MISSING from the database. A migration was probably edited in place after it was applied, so db push skipped the change. Apply the missing statements by hand, then re-run."
            echo "$missing"
            exit 1
          fi
          echo "All $actual declared objects present."

  Production-preview:
    runs-on: ${{ matrix.os }}
    needs: Deploy-migration

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Yarn Install
        run: yarn install
      - name: Install Vercel
        run: yarn global add vercel@latest
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: echo ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
